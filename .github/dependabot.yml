version: 2
updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: "/quickwit"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Docker dependencies
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Cooldown applies only to version updates, not security updates
    cooldown:
      default-days: 14
    groups:
      # Group all version updates into a single PR; security updates remain ungrouped
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # NPM dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
